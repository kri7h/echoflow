<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/echo-flow-favicon.svg" />
    <title>echoFlow - v0.1</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

          <li>
  <button type="button" class="profile-btn" aria-label="Log in or sign up">

            <div>Music 1</div>
